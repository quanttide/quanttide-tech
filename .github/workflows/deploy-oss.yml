name: MyST Deploy to OSS (qtdocs-site)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /quanttide-tech

jobs:
  deploy-oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets (OSS base url)
        run: myst build --html

      - uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-hangzhou.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload to OSS
        run: |
          ossutil rm oss://qtdocs-site/quanttide-tech/ -r -f || true
          ossutil cp ./_build/html/ oss://qtdocs-site/quanttide-tech/ -r -f --meta=Cache-Control:public,max-age=300